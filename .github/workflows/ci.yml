name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: build-only-ci-secret-with-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-with-at-least-32-characters
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: build-only-ci-secret-with-at-least-32-characters
      CREDENTIAL_ENCRYPTION_KEY: ci-only-encryption-key-with-at-least-32-characters
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
